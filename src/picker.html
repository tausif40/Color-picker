<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Pick a color</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; cursor: none; user-select: none; }
    [hidden] { display: none !important; }
    #feed { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

    /* Round magnifier only: no card, no text. */
    #loupe {
      position: absolute; left: 0; top: 0; z-index: 1; width: 128px; height: 128px;
      border-radius: 50%; overflow: hidden; background: #2a2d36; pointer-events: none; will-change: transform;
      box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px rgba(10, 12, 18, .35), 0 12px 30px rgba(10, 12, 18, .4);
    }
    #zoom { display: block; width: 128px; height: 128px; image-rendering: pixelated; }

    /* Plus-shaped pinpoint cursor; its centre is the pixel that will be picked. */
    #pointer { position: absolute; left: 0; top: 0; z-index: 2; width: 25px; height: 25px; pointer-events: none; will-change: transform; }
    #pointer svg { display: block; width: 100%; height: 100%; overflow: visible; }
  </style>
</head>
<body>
  <video id="feed" autoplay muted playsinline></video>

  <div id="loupe" aria-hidden="true" hidden><canvas id="zoom"></canvas></div>

  <!-- Last in the page so the cursor is always drawn on top. -->
  <div id="pointer" aria-hidden="true" hidden>
    <svg viewBox="0 0 25 25" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-linecap="round">
      <path d="M12.5 1.5v8.5M12.5 15v8.5M1.5 12.5H10M15 12.5h8.5" stroke="#0d0f14" stroke-opacity=".7" stroke-width="3.6"/>
      <path d="M12.5 1.5v8.5M12.5 15v8.5M1.5 12.5H10M15 12.5h8.5" stroke="#fff" stroke-width="1.6"/>
    </svg>
  </div>

  <script src="picker.js"></script>
</body>
</html>
